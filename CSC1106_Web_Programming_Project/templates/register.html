<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - WIVAH Bank</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/auth.css">
    <link rel="stylesheet" href="/static/css/forms.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-card register-card">

            <div class="auth-logo">WB</div>

            <h1>Create Account</h1>
            <p>Register for a new WIVAH Bank banking account.</p>

            {% if error_message %}
                <div class="error-message">
                    {{ error_message }}
                </div>
            {% endif %}

            <form method="post" action="/register" class="auth-form">

                <div class="auth-grid">
                    <div>
                        <label for="first_name">First Name</label>
                        <input
                            type="text"
                            id="first_name"
                            name="first_name"
                            placeholder="First name"
                            value="{{ first_name | default(value='') }}"
                            required
                        >
                    </div>

                    <div>
                        <label for="last_name">Last Name</label>
                        <input
                            type="text"
                            id="last_name"
                            name="last_name"
                            placeholder="Last name"
                            value="{{ last_name | default(value='') }}"
                            required
                        >
                    </div>
                </div>

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    value="{{ username | default(value='') }}"
                    required
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    value="{{ email | default(value='') }}"
                    required
                >

                <label for="phone_number">Phone Number</label>
                <input
                    type="text"
                    id="phone_number"
                    name="phone_number"
                    placeholder="Enter your phone number"
                    value="{{ phone_number | default(value='') }}"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

                <label for="confirm_password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >

                <button type="submit" class="auth-btn">
                    Register
                </button>

            </form>

            <div class="auth-footer">
                <p>Already have an account?</p>
                <a href="/login">Login here</a>
            </div>

            <a href="/" class="back-home">← Back to Home</a>

        </div>
    </div>

</body>
</html>
