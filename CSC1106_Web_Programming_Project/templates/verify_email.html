<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Email - WIVAH Bank</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/auth.css">
    <link rel="stylesheet" href="/static/css/forms.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-card">

            <div class="auth-logo">WB</div>

            <h1>Verify Email</h1>
            <p>Enter the 6-digit OTP sent to your email.</p>

            {% if success_message %}
                <div class="success-message">
                    {{ success_message }}
                </div>
            {% endif %}

            {% if error_message %}
                <div class="error-message">
                    {{ error_message }}
                </div>
            {% endif %}

            <form method="post" action="/verify-email" class="auth-form">

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your account email"
                    value="{{ email | default(value='') }}"
                    required
                >

                <label for="otp">OTP</label>
                <input
                    type="text"
                    id="otp"
                    name="otp"
                    placeholder="Enter 6-digit OTP"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    maxlength="6"
                    title="Enter the 6-digit OTP sent to your email."
                    required
                >

                <button type="submit" class="auth-btn">
                    Verify Email
                </button>

                <button
                    type="submit"
                    formaction="/resend-verification-otp"
                    formnovalidate
                    class="auth-btn secondary-btn"
                >
                    Resend OTP
                </button>

            </form>

            <div class="auth-footer">
                <p>Already verified?</p>
                <a href="/login">Back to login</a>
            </div>

            <a href="/" class="back-home">Back to Home</a>

        </div>
    </div>

</body>
</html>
