<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set New Password - WIVAH Bank</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/auth.css">
    <link rel="stylesheet" href="/static/css/forms.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-card">

            <div class="auth-logo">RB</div>

            <h1>New Password</h1>
            <p>Create a new password for your WIVAH Bank account.</p>

            {% if success_message %}
                <div class="success-message">
                    {{ success_message }}
                </div>
            {% endif %}

            {% if error_message %}
                <div class="error-message">
                    {{ error_message }}
                </div>
            {% endif %}

            {% if token %}
                <form method="post" action="/reset-password" class="auth-form">

                    <input type="hidden" name="token" value="{{ token }}">

                    <label for="password">New Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter a new password"
                        minlength="8"
                        required
                    >

                    <label for="confirm_password">Confirm New Password</label>
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your new password"
                        minlength="8"
                        required
                    >

                    <button type="submit" class="auth-btn">
                        Update Password
                    </button>

                </form>
            {% endif %}

            <div class="auth-footer">
                <p>Need a new reset link?</p>
                <a href="/forgot-password">Request another link</a>
            </div>

            <a href="/login" class="back-home">Back to Login</a>

        </div>
    </div>

</body>
</html>
